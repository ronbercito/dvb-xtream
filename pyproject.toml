[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvb-xtream"
version = "0.1.0"
description = "Local Xtream Codes compatible access layer for DVB streaming"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dvb_xtream*"]

[tool.setuptools.package-data]
dvb_xtream = ["admin.html"]
